name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  litmus-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile x86 litmus harness (compile-only smoke)
        run: gcc -O2 -pthread -Wall -Wextra linux/litmus/litmus_test.c -o litmus_test
      - name: Compile IPC ping-pong harness (compile-only smoke)
        run: gcc -O2 -pthread -Wall -Wextra linux/ipc/core_pingpong.c -o core_pingpong

  # Act X/XII-D: physical Apple Silicon litmus data on every push.
  # macos-latest runners are ARM64 — each run publishes TWO arms of the
  # three-arm experiment: native weak ARM64, and the same source compiled
  # for x86_64 executing under Rosetta 2's hardware TSO mode. (Native x86
  # control runs on the lab box / litmus-build smoke.)
  macos-litmus:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile litmus harness (Apple Clang, ARM64)
        run: clang -O2 -pthread -Wall -Wextra linux/litmus/litmus_test.c -o litmus_test_arm64
      - name: Compile litmus harness (x86_64 cross-compile for Rosetta)
        run: clang -O2 -pthread -Wall -Wextra -arch x86_64 linux/litmus/litmus_test.c -o litmus_test_x86_64
      - name: Run SB/MP/LB/WRC/IRIW litmus sweep (native ARM64, Act XVII-8 escalation: 1M iters)
        run: mkdir -p data && ./litmus_test_arm64 1000000 data/litmus_macos_arm64.json
      - name: Run same sweep under Rosetta 2 (translated x86_64 → TSO)
        run: arch -x86_64 ./litmus_test_x86_64 1000000 data/litmus_macos_rosetta.json
      - uses: actions/upload-artifact@v4
        with:
          name: litmus-macos-arm64
          path: data/litmus_macos_arm64.json
      - uses: actions/upload-artifact@v4
        with:
          name: litmus-macos-rosetta
          path: data/litmus_macos_rosetta.json
